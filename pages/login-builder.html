<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Builder Login - Urban Sprawl Management System">
    <title>Builder Login | Urban Sprawl Management</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <div class="login-page">
        <div class="login-container">
            <a href="../index.html"
                style="display: block; text-align: center; margin-bottom: var(--spacing-lg); color: var(--text-secondary); font-size: var(--font-size-sm);">
                ← Back to Home
            </a>

            <div class="login-card">
                <div class="login-icon builder">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 20h20" />
                        <path d="M5 20V8.7a1 1 0 0 1 .4-.8l4-2.7a1 1 0 0 1 1.2 0l4 2.7a1 1 0 0 1 .4.8V20" />
                        <path d="M15 20v-4a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v4" />
                    </svg>
                </div>

                <h2>Builder Portal</h2>
                <p class="subtitle">Urban planners and government officials access</p>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Official Email</label>
                        <input type="email" id="email" class="form-input" placeholder="planner@city.gov" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password"
                            required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="department">Department (Optional)</label>
                        <select id="department" class="form-input">
                            <option value="">Select department...</option>
                            <option value="planning">Urban Planning</option>
                            <option value="infrastructure">Infrastructure</option>
                            <option value="environment">Environmental</option>
                            <option value="transport">Transportation</option>
                            <option value="housing">Housing Development</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
                        <label
                            style="display: flex; align-items: center; gap: 8px; font-size: var(--font-size-sm); cursor: pointer;">
                            <input type="checkbox" id="remember">
                            Remember me
                        </label>
                        <a href="#" style="font-size: var(--font-size-sm); color: var(--primary-emerald);">Forgot
                            password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Sign In to Builder Portal
                    </button>
                </form>

                <div class="login-footer">
                    <p>Not a builder? Access <a href="login-developer.html">Developer</a> or <a
                            href="login-user.html">User</a> portals</p>
                </div>
            </div>

            <p
                style="text-align: center; margin-top: var(--spacing-lg); font-size: var(--font-size-xs); color: var(--text-muted);">
                For demo purposes, use any email and password to access the dashboard.
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            // Simulate login - redirect to dashboard
            window.location.href = 'dashboard-builder.html';
        });
    </script>
</body>

</html>
